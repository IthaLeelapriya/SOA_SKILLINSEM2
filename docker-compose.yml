
services:
  app-db:
    image: postgres:15
    container_name: app-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app-service:
    build: ./app
    container_name: app-service
    ports:
      - "8080:8080"
    depends_on:
      app-db:
        condition: service_healthy
    environment:
      DB_HOST: app-db
      DB_NAME: mydb
      DB_USER: admin
      DB_PASSWORD: password
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
